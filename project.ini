# A DOSDev project: Projects in DOSDev's menu, "dosdev project" on the
# command line. DOSDev reads this every time, so it can be changed freely.
#   build     make: builds build/DE.EXE (make package makes build/DE.ZIP, the
#             package to add with Modules > Add software)
#   run       Enter opens DE on its own source, in the Workbench
[project]
name = DE (DOSDev Editor)
template = c-djgpp
build_on = linux
build = make
output = build/DE.EXE
run = build\DE.EXE src\EDITOR.C
debug = GDB build\DE.EXE
edit = src/EDITOR.C
